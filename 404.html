<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — RyderTex</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/rydertex/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/rydertex/assets/icons/icon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="/rydertex/assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/rydertex/css/styles.css">
<style>
  .error-404{min-height:70vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 var(--gutter);gap:20px}
  .error-404 .kicker{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#5B6169}
  .error-404 h1{font-size:clamp(40px,7vw,88px);line-height:.95;margin:0}
  .error-404 p{max-width:46ch;color:#4A4F57;font-size:16px;line-height:1.5}
  .error-404 .btn-solid{margin-top:8px}
</style>
</head>
<body>
<div class="page-wrap">
  <div class="noise-overlay" aria-hidden="true"></div>
  <div id="site-header"></div>
  <main>
    <section class="error-404">
      <span class="kicker">404 · Not found</span>
      <h1>That page isn't on the floor.</h1>
      <p>The page you're looking for has moved or doesn't exist. Try the fabric library, or head back to the homepage.</p>
      <div class="home-hero-ctas">
        <a href="/rydertex/" class="btn-solid">Back to homepage</a>
        <a href="/rydertex/fabrics/" class="btn-outline">View fabric library</a>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
</div>
<script src="/rydertex/js/header.js"></script>
<script src="/rydertex/js/footer.js"></script>
</body>
</html>
